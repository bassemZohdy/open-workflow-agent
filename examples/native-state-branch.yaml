# Opt-in LangGraph source profile; mount both example files under /config.
model:
  provider: fake
  name: fake/default
workflow:
  path: /config/native-state-branch-workflow.yaml
native_state:
  timeout_seconds: 30
native_state_updates: {}
native_state_branch:
  bounds:
    max_native_bytes: 8388608
    max_concurrency: 2
    timeout_seconds: 30
  max_active_branches: 2
  max_branches_per_source: 8
security:
  profiles:
    state-owner:
      type: bearer
      principal: state-owner
      roles: [state-owner]
      scopes: [native-state]
      audience: [runtime]
      token:
        from_env: OWA_NATIVE_STATE_TOKEN
server:
  api_security_profile: state-owner
execution_authorization:
  enabled: true
  id: native-state-branch-example
  version: '1'
  policy:
    rules:
      - actions: [invocations.create]
        resources: ['workflow:examples/native-state-branch@1.0.0']
        roles: [state-owner]
        scopes: [native-state]
        audience: [runtime]
      - actions: [catalog.call, model.complete, state.inspect, state.branch, invocations.resume, invocations.cancel]
        resources: ['*']
        roles: [state-owner]
        scopes: [native-state]
        audience: [runtime]
