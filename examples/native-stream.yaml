# Opt-in LangGraph source profile; requires a build containing this feature.
model:
  provider: fake
  name: fake/default
workflow:
  path: /config/native-stream-workflow.yaml
observability:
  native_streams: {}
security:
  profiles:
    stream-owner:
      type: bearer
      principal: stream-owner
      roles: [stream-owner]
      scopes: [native-stream]
      audience: [runtime]
      token:
        from_env: OWA_NATIVE_STREAM_TOKEN
server:
  api_security_profile: stream-owner
execution_authorization:
  enabled: true
  id: native-stream-example
  version: '1'
  policy:
    rules:
      - actions: [invocations.create]
        resources: ['workflow:examples/native-stream@1.0.0']
        roles: [stream-owner]
        scopes: [native-stream]
        audience: [runtime]
      - actions: [invocations.stream, invocations.resume]
        resources: ['*']
        roles: [stream-owner]
        scopes: [native-stream]
        audience: [runtime]
      - actions: [catalog.call]
        resources: ['llm:1.0.0@default']
        roles: [stream-owner]
        scopes: [native-stream]
        audience: [runtime]
      - actions: [model.complete]
        resources: [fake/default]
        roles: [stream-owner]
        scopes: [native-stream]
        audience: [runtime]
