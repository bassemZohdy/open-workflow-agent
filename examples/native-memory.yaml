# Opt-in LangGraph source profile; requires a build containing this feature.
model:
  provider: fake
  name: fake/default
workflow:
  path: /config/native-memory-workflow.yaml
memory:
  enabled: true
  native:
    - id: notes
      collection: notes
      max_record_bytes: 16384
      max_records: 1000
      max_value_bytes: 1048576
      max_search_results: 20
      retention_seconds: 2592000
security:
  profiles:
    notes-owner:
      type: bearer
      principal: notes-owner
      roles: [memory-owner]
      scopes: [memory]
      audience: [runtime]
      token:
        from_env: OWA_NOTES_TOKEN
server:
  api_security_profile: notes-owner
execution_authorization:
  enabled: true
  id: native-memory-example
  version: '1'
  policy:
    rules:
      - actions: [catalog.call, memory.search, memory.add, memory.delete]
        resources:
          - memory:self
          - memory.get:1.0.0@notes
          - memory.put:1.0.0@notes
          - memory.search:1.0.0@notes
          - memory.delete:1.0.0@notes
          - memory.sweep:1.0.0@notes
        roles: [memory-owner]
        scopes: [memory]
        audience: [runtime]
      - actions: [memory.inspect, memory.resolve, invocations.resume]
        resources: ['*']
        roles: [memory-owner]
        scopes: [memory]
        audience: [runtime]
