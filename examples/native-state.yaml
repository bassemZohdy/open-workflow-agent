# Opt-in LangGraph source profile; requires a build containing this feature.
model:
  provider: fake
  name: fake/default
workflow:
  path: /config/native-state-workflow.yaml
native_state: {}
security:
  profiles:
    state-owner:
      type: bearer
      principal: state-owner
      roles: [state-owner]
      scopes: [native-state]
      audience: [runtime]
      token:
        from_env: OWA_NATIVE_STATE_TOKEN
server:
  api_security_profile: state-owner
execution_authorization:
  enabled: true
  id: native-state-example
  version: '1'
  policy:
    rules:
      - actions: [invocations.create]
        resources: ['workflow:examples/native-state@1.0.0']
        roles: [state-owner]
        scopes: [native-state]
        audience: [runtime]
      - actions: [state.inspect]
        resources: ['*']
        roles: [state-owner]
        scopes: [native-state]
        audience: [runtime]
      - actions: [catalog.call]
        resources: ['llm:1.0.0@default']
        roles: [state-owner]
        scopes: [native-state]
        audience: [runtime]
      - actions: [model.complete]
        resources: [fake/default]
        roles: [state-owner]
        scopes: [native-state]
        audience: [runtime]
