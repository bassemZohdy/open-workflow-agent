document:
  dsl: '1.0.3'
  namespace: examples
  name: scheduled-report
  version: '1.0.0'

# Exactly one of schedule.after or schedule.every is allowed. `every` recurs
# after each successful completion; `after` runs once, delayed. The bounded
# profile has no cron support.
schedule:
  every:
    hours: 6

do:
  - report:
      call: agent:1.0.0@default
      with:
        input: ${ .input }
