[project]
name = "open-workflow-agent"
version = "0.2.0"
description = "Configuration-driven Open Workflow runtime with interchangeable engines"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Bassem Zohdy" }]
requires-python = ">=3.12"
dependencies = [
  "croniter==6.2.4",
  "tzdata==2026.5",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "mcp==2.3.0",
  "a2a-sdk==1.2.2",
  "grpcio==1.84.0",
  "jsonschema==4.26.0",
  "referencing==0.37.0",
  "jq==1.13.0",
  "pydantic==2.14.1",
  "PyYAML==6.0.3",
  "uvicorn==0.54.0",
]

[project.scripts]
owa = "open_workflow_agent.cli:main"

[dependency-groups]
dev = [
  "apsw==3.54.1.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.1",
  "ruff==0.17.3",
  "mypy==2.4.0",
  "types-jsonschema==4.26.0.20261006",
  "types-PyYAML==6.0.12.20260815",
  "pytest-cov>=7.1.0",
]
mutation = [
  "mutmut==3.8.0",
]

[project.optional-dependencies]
model = ["litellm==1.101.0"]
knowledge = [
  "fastembed==0.9.1",
  "numpy==2.5.4",
  "pypdf==6.21.3",
]
postgres = ["psycopg[binary]==3.3.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core/src/open_workflow_agent"]

[tool.hatch.build.hooks.custom]

[tool.uv]
constraint-dependencies = ["filelock>=4.2.1,<5"]
override-dependencies = ["pillow>=13.0.0,<14"]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "core/src",
  "engines/adk/src",
  "engines/langgraph/src",
  "engines/agent-framework/src",
]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = "^tests/"
mypy_path = [
  "core/src",
  "engines/adk/src",
  "engines/langgraph/src",
  "engines/agent-framework/src",
]

[[tool.mypy.overrides]]
module = [
  "open_workflow_agent_adk.*",
  "open_workflow_agent_langgraph.*",
  "open_workflow_agent_agent_framework.*",
]
# The native SDKs are optional and their type surfaces are incomplete. Keep
# strict checking for adapter-owned code while treating those imports as an
# explicitly bounded integration boundary.
ignore_missing_imports = true
warn_unused_ignores = false
disable_error_code = ["untyped-decorator"]

[[tool.mypy.overrides]]
module = [
  "agent_framework.*",
  "google.*",
  "langchain_core.*",
  "langgraph.*",
]
ignore_missing_imports = true

[tool.mutmut]
source_paths = ["src"]
only_mutate = [
  "src/open_workflow_agent/traffic_policy.py",
]
pytest_add_cli_args_test_selection = [
  "tests/mutation/test_traffic_policy_mutation.py",
]
pytest_add_cli_args = ["--override-ini=pythonpath=src"]
