[project]
name = "open-workflow-agent"
version = "0.1.0"
description = "Configuration-driven Open Workflow runtime with interchangeable engines"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "langgraph>=0.2",
  "jsonschema>=4.23",
  "numpy>=2.0",
  "pypdf>=5.0",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-jsonschema>=4.23",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core/src/open_workflow_agent"]

[tool.pytest.ini_options]
pythonpath = ["core/src", "engines/adk/src", "engines/langgraph/src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = "^(engines|tests)/"
