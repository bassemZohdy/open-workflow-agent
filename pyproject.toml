[project]
name = "open-workflow-agent"
version = "0.1.0"
description = "Configuration-driven Open Workflow runtime with interchangeable engines"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "numpy==2.4.6; python_version < '3.12'",
  "numpy==2.5.2; python_version >= '3.12'",
  "pypdf==6.16.2",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.4",
  "mypy==2.3.1",
  "types-jsonschema==4.26.0.20260518",
  "types-PyYAML==6.0.12.20260815",
]

[project.optional-dependencies]
model = ["litellm==1.80.5"]
knowledge = ["fastembed==0.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core/src/open_workflow_agent"]

[tool.pytest.ini_options]
pythonpath = ["core/src", "engines/adk/src", "engines/langgraph/src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = "^(engines|tests)/"
