# Revision: 48db0cf5e1a1d3202cbbec6021736e1d89e94cd0
# Changes: Predicate changed to jq equality; plain strings; explicit end prevents fall-through.
document:
  dsl: '1.0.3'
  namespace: fixtures
  name: switch
  version: '1.0.0'
do:
  - route:
      switch:
        - 'yes':
            when: '${ .enabled == true }'
            then: enabled
        - default:
            then: disabled
  - enabled:
      set:
        result: enabled
      then: end
  - disabled:
      set:
        result: disabled
