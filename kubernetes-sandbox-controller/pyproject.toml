[project]
name = "open-workflow-agent-kubernetes-sandbox-controller"
version = "0.1.0"
description = "Restricted Kubernetes/OpenShift sandbox controller for Open Workflow Agent"
license = "MIT"
license-files = ["../LICENSE"]
readme = "README.md"
authors = [{ name = "Bassem Zohdy" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "uvicorn==0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_workflow_agent_kubernetes_sandbox_controller"]
