[project]
name = "open-workflow-agent-adk"
version = "0.1.0"
description = "Google ADK engine adapter for the Open Workflow Agent"
license = "MIT"
license-files = ["../../LICENSE"]
readme = "README.md"
authors = [{ name = "Bassem Zohdy" }]
requires-python = ">=3.12"
dependencies = ["open-workflow-agent"]

[project.optional-dependencies]
native = ["google-adk==2.7.1"]
knowledge = ["open-workflow-agent[knowledge]"]
model = ["open-workflow-agent[model]"]
postgres = ["open-workflow-agent[postgres]", "google-adk[db]==2.7.1", "asyncpg==0.31.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_workflow_agent_adk"]

[tool.uv.sources]
open-workflow-agent = { path = "../..", editable = true }
