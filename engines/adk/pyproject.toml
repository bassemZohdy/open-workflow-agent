[project]
name = "open-workflow-agent-adk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["open-workflow-agent"]

[project.optional-dependencies]
native = ["google-adk==2.7.1"]
knowledge = ["open-workflow-agent[knowledge]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_workflow_agent_adk"]

[tool.uv.sources]
open-workflow-agent = { path = "../..", editable = true }
