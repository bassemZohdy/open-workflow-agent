[project]
name = "open-workflow-agent-adk"
version = "0.2.0"
description = "Google ADK engine adapter for the Open Workflow Agent"
license = "MIT"
license-files = ["../../LICENSE"]
readme = "README.md"
authors = [{ name = "Bassem Zohdy" }]
requires-python = ">=3.12"
dependencies = ["open-workflow-agent"]

[project.optional-dependencies]
native = ["google-adk==2.7.1"]
knowledge = ["open-workflow-agent[knowledge]"]
model = ["open-workflow-agent[model]"]
postgres = ["open-workflow-agent[postgres]", "google-adk[db]==2.7.1", "asyncpg==0.32.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_workflow_agent_adk"]

[tool.hatch.build.hooks.custom]

[tool.uv]
constraint-dependencies = [
  "authlib>=1.9.1,<1.10",
  "filelock>=4.2.1,<5",
  "joserfc>=1.7.6,<1.8",
  "opentelemetry-api>=1.45.2,<1.46",
  "opentelemetry-sdk>=1.45.2,<1.46",
  "pyasn1>=0.6.5,<0.7",
]
# ADK's upstream telemetry cap excludes the fixed tracestate parser. Keep the
# API and SDK paired and qualify this compatibility override on both backends.
override-dependencies = [
  "pillow>=13.0.0,<14",
  "opentelemetry-api==1.45.2",
  "opentelemetry-sdk==1.45.2",
]

[tool.uv.sources]
open-workflow-agent = { path = "../..", editable = true }
