[project]
name = "open-workflow-agent-agent-framework"
version = "0.1.0"
description = "Microsoft Agent Framework adapter for Open Workflow Agent"
license = "MIT"
license-files = ["../../LICENSE"]
readme = "README.md"
authors = [{ name = "Bassem Zohdy" }]
requires-python = ">=3.12"
dependencies = ["open-workflow-agent"]

[project.optional-dependencies]
native = ["agent-framework-core==1.15.0"]
knowledge = ["open-workflow-agent[knowledge]"]
model = ["open-workflow-agent[model]"]
postgres = ["open-workflow-agent[postgres]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_workflow_agent_agent_framework"]

[tool.uv.sources]
open-workflow-agent = { path = "../..", editable = true }
