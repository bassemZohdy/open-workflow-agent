[project]
name = "open-workflow-agent-langgraph"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["open-workflow-agent", "langgraph>=0.2"]

[project.optional-dependencies]
sqlite = ["langgraph-checkpoint-sqlite>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_workflow_agent_langgraph"]

[tool.uv.sources]
open-workflow-agent = { path = "../..", editable = true }
