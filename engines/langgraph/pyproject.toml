[project]
name = "open-workflow-agent-langgraph"
version = "0.1.0"
description = "LangGraph engine adapter for the Open Workflow Agent"
license = "MIT"
license-files = ["../../LICENSE"]
readme = "README.md"
authors = [{ name = "Bassem Zohdy" }]
requires-python = ">=3.12"
dependencies = ["open-workflow-agent", "langgraph==1.2.11"]

[project.optional-dependencies]
sqlite = ["langgraph-checkpoint-sqlite==3.1.1"]
knowledge = ["open-workflow-agent[knowledge]"]
model = ["open-workflow-agent[model]"]
postgres = [
  "open-workflow-agent[postgres]",
  "langgraph-checkpoint-postgres==3.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_workflow_agent_langgraph"]

[tool.uv.sources]
open-workflow-agent = { path = "../..", editable = true }
