name: Security

on:
  schedule:
    # Mondays 06:00 UTC: weekly advisory sweep over every locked environment.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/uv.lock"
      - "**/pyproject.toml"
      - ".github/workflows/security.yml"
      - "ci/security_audit.py"
      - "tests/ci/test_security_audit.py"
  pull_request:
    paths:
      - "**/uv.lock"
      - "**/pyproject.toml"
      - ".github/workflows/security.yml"
      - "ci/security_audit.py"
      - "tests/ci/test_security_audit.py"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.12"
  PIP_AUDIT_VERSION: "2.7.3"

jobs:
  dependencies:
    name: Audit ${{ matrix.id }} dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: .
            id: root
            extras: --extra model --extra knowledge --extra postgres
          - project: engines/adk
            id: adk
            extras: --extra native --extra postgres --extra knowledge --extra model
          - project: engines/langgraph
            id: langgraph
            extras: --extra sqlite --extra postgres --extra knowledge --extra model
          - project: engines/agent-framework
            id: agent-framework
            extras: --extra native --extra knowledge --extra model --extra postgres
          - project: sandbox-controller
            id: sandbox-controller
            extras: ""
          - project: kubernetes-sandbox-controller
            id: kubernetes-sandbox-controller
            extras: ""
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install Python
        run: uv python install "$PYTHON_VERSION"
      - name: Export resolved requirements
        run: |
          set -euo pipefail
          # --no-emit-package drops the engines' editable root-package reference,
          # which pip-audit cannot audit, while keeping its resolved dependencies.
          uv export --project "${{ matrix.project }}" --locked --no-hashes \
            --format requirements-txt --no-emit-project \
            --no-emit-package open-workflow-agent --no-dev ${{ matrix.extras }} \
            --output-file "${{ runner.temp }}/requirements.txt"
      - name: Audit resolved dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            set +e
            uvx --with 'urllib3>=2.8.0' "pip-audit==$PIP_AUDIT_VERSION" \
              --requirement "${{ runner.temp }}/requirements.txt" \
              --no-deps --strict --format json --desc off --aliases off \
              --progress-spinner off --timeout 60 \
              --output "${{ runner.temp }}/audit.json"
            status=$?
            set -e
            if [[ -s "${{ runner.temp }}/audit.json" ]]; then
              break
            fi
            if [[ "$attempt" == 1 ]]; then
              echo "Audit did not produce a report; retrying once" >&2
              sleep 2
            fi
          done
          if [[ ! -s "${{ runner.temp }}/audit.json" ]]; then
            echo "pip-audit produced no report" >&2
            exit 1
          fi
          python ci/security_audit.py "${{ runner.temp }}/audit.json" \
            --auditor-status "$status"
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-${{ matrix.id }}
          path: ${{ runner.temp }}/audit.json
          if-no-files-found: ignore
