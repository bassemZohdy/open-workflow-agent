name: Docs

on:
  pull_request:
    paths:
      - "**/*.md"
      - "tests/ci/validate_docs.py"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "tests/ci/validate_docs.py"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate relative Markdown links
        run: python3 tests/ci/validate_docs.py
