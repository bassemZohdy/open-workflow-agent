name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: bassemzohdy

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve verified release tag
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      series: ${{ steps.release.outputs.series }}
      short_sha: ${{ steps.release.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve semver tag and project version
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --force --tags

          tag="$(git tag --points-at "$RELEASE_SHA" --list 'v*.*.*' --sort=-v:refname | head -n1)"
          if [[ -z "$tag" ]]; then
            echo "No release tag points at verified commit $RELEASE_SHA; nothing to publish."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $tag is not a supported stable release tag (expected vX.Y.Z)." >&2
            exit 1
          fi

          version="${tag#v}"
          series="${version%.*}"
          project_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text())['project']['version'])
          PY
          )"

          if [[ "$version" != "$project_version" ]]; then
            echo "Release tag $tag does not match project version $project_version." >&2
            exit 1
          fi

          python - "$version" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          expected = sys.argv[1]
          paths = (
              'core/pyproject.toml',
              'engines/adk/pyproject.toml',
              'engines/langgraph/pyproject.toml',
          )
          for path in paths:
              actual = tomllib.loads(Path(path).read_text())['project']['version']
              if actual != expected:
                  raise SystemExit(f'{path} has version {actual}, expected {expected}')
          PY

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; skipping duplicate publication."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "series=$series" >> "$GITHUB_OUTPUT"
          echo "short_sha=${RELEASE_SHA:0:12}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.engine }} image
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [adk, langgraph]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/open-workflow-agent-${{ matrix.engine }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.series }}
            type=raw,value=latest
            type=raw,value=sha-${{ needs.prepare.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      - name: Build and push release image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.engine }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OWA_VERSION=${{ needs.prepare.outputs.version }}
            VCS_REF=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=release-${{ matrix.engine }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.engine }}
          provenance: mode=max
          sbom: true

      - name: Attest published image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/open-workflow-agent-${{ matrix.engine }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record published image
        shell: bash
        run: |
          {
            echo "### ${{ matrix.engine }} image"
            echo "- Image: \`${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/open-workflow-agent-${{ matrix.engine }}:${{ needs.prepare.outputs.version }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Tags: \`${{ needs.prepare.outputs.version }}\`, \`${{ needs.prepare.outputs.series }}\`, \`latest\`, \`sha-${{ needs.prepare.outputs.short_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: Create GitHub Release
    needs: [prepare, publish]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create release with pull instructions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          ## Container images

          \`\`\`bash
          docker pull ghcr.io/bassemzohdy/open-workflow-agent-adk:${RELEASE_VERSION}
          docker pull ghcr.io/bassemzohdy/open-workflow-agent-langgraph:${RELEASE_VERSION}
          \`\`\`

          The same images are also tagged \`${RELEASE_VERSION%.*}\`, \`latest\`, and with the verified commit SHA. Release images include OCI SBOM/provenance metadata and GitHub build provenance attestations.
          EOF

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Open Workflow Agent $RELEASE_TAG" \
            --generate-notes \
            --notes-file "$notes"
