name: Format B-006 Branch

on:
  push:
    branches:
      - feat/b006-kubernetes-controller

permissions:
  contents: write

concurrency:
  group: format-b006-branch
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/b006-kubernetes-controller
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Format changed Python sources
        run: |
          uv run --locked ruff format \
            core/src/open_workflow_agent/config.py \
            core/src/open_workflow_agent/kubernetes_sandbox.py \
            core/src/open_workflow_agent/services.py \
            kubernetes-sandbox-controller/src \
            tests/core/test_kubernetes_sandbox_backend.py \
            tests/core/test_kubernetes_sandbox_controller.py \
            tests/core/test_kubernetes_sandbox_manifests.py
      - name: Commit formatting when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            core/src/open_workflow_agent/config.py \
            core/src/open_workflow_agent/kubernetes_sandbox.py \
            core/src/open_workflow_agent/services.py \
            kubernetes-sandbox-controller/src \
            tests/core/test_kubernetes_sandbox_backend.py \
            tests/core/test_kubernetes_sandbox_controller.py \
            tests/core/test_kubernetes_sandbox_manifests.py
          git commit -m "style: format B-006 Kubernetes sandbox slice"
          git push origin HEAD:feat/b006-kubernetes-controller
