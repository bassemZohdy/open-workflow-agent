name: Agent Framework CI

on:
  push:
    branches:
      - main
    paths:
      - "engines/agent-framework/**"
      - "tests/agent_framework/**"
      - ".github/workflows/agent-framework-ci.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches:
      - main
    paths:
      - "engines/agent-framework/**"
      - "tests/agent_framework/**"
      - ".github/workflows/agent-framework-ci.yml"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: engines/agent-framework
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6.8.0
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Check committed engine lock
        run: uv lock --check
      - name: Run native, shared contract, and CTK suites
        run: >-
          uv run --locked --extra native --with pytest --with pytest-asyncio
          pytest ../../tests/agent_framework ../../tests/contract ../../tests/ctk -vv
      - name: Build adapter wheel
        run: uv build
