  postgres-runtime:
    if: github.event_name == 'workflow_dispatch' || vars.OWA_AUTOMATIC_CI == 'true'
    name: PostgreSQL persistence ${{ matrix.engine }} acceptance
    runs-on: ubuntu-latest
    needs: [postgres-core, postgres-langgraph, postgres-adk, postgres-agent-framework, postgres-adk-lifecycle, postgres-langgraph-lifecycle, postgres-adk-operations, postgres-langgraph-operations]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: adk
            port: 18180
          - engine: langgraph
            port: 18181
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: owa
          POSTGRES_PASSWORD: owa
          POSTGRES_DB: owa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U owa -d owa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build PostgreSQL-enabled runtime image
        shell: bash
        run: |
          set -euo pipefail
          owa_version="$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')"
          timeout --signal=TERM --kill-after=30s 12m \
            docker build --build-arg OWA_VERSION="$owa_version" --build-arg VCS_REF=${{ github.sha }} \
            --file docker/Dockerfile.${{ matrix.engine }} \
            --tag owa-${{ matrix.engine }}:postgres-${{ github.sha }} .
      - name: Start, restart, and invoke against PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          mkdir -p "$workdir/config" "$workdir/knowledge" "$workdir/data"
          chmod 0777 "$workdir/data"
          cat > "$workdir/config/agent.yaml" <<'YAML'
          model:
            provider: fake
            name: fake/default
          persistence:
            datasource: postgresql://owa:owa@host.docker.internal:5432/owa
          knowledge:
            path: /knowledge
            reload:
              mode: startup
          YAML
          printf '%s\n' 'PostgreSQL persistence acceptance document.' > "$workdir/knowledge/policy.md"
          name="owa-${{ matrix.engine }}-postgres"
          restarted_name="${name}-restarted"
          log_file="$RUNNER_TEMP/owa-${{ matrix.engine }}-postgres.log"
          restarted_log_file="$RUNNER_TEMP/owa-${{ matrix.engine }}-postgres-restarted.log"
          cleanup() {
            docker logs "$name" > "$log_file" 2>&1 || true
            docker logs "$restarted_name" > "$restarted_log_file" 2>&1 || true
            docker rm --force "$name" "$restarted_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          run_args=(
            --read-only
            --tmpfs /tmp:rw,nosuid,nodev,size=256m
            --user 12345:0
            --add-host host.docker.internal:host-gateway
            --volume "$workdir/config:/config:ro"
            --volume "$workdir/knowledge:/knowledge:ro"
            --volume "$workdir/data:/data:rw"
          )
          docker run --detach --name "$name" --publish ${{ matrix.port }}:8080 "${run_args[@]}" \
            "owa-${{ matrix.engine }}:postgres-${{ github.sha }}"
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:${{ matrix.port }}/health/ready" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "http://127.0.0.1:${{ matrix.port }}/health/ready" >/dev/null
          invocation="$(curl --fail --silent --request POST --header 'content-type: application/json' \
            --data '{"input":{"question":"postgres"}}' \
            "http://127.0.0.1:${{ matrix.port }}/v1/invoke")"
          python -c 'import json, sys; d=json.loads(sys.argv[1]); assert d["status"] == "completed"; assert d["output"]["response"]["question"] == "postgres"' "$invocation"
          docker stop --time 5 "$name" >/dev/null
          docker rm "$name" >/dev/null
          docker run --detach --name "$restarted_name" --publish ${{ matrix.port }}:8080 "${run_args[@]}" \
            "owa-${{ matrix.engine }}:postgres-${{ github.sha }}"
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:${{ matrix.port }}/health/ready" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "http://127.0.0.1:${{ matrix.port }}/health/ready" >/dev/null
          capabilities="$(curl --fail --silent "http://127.0.0.1:${{ matrix.port }}/v1/capabilities")"
          python -c 'import json, sys; d=json.loads(sys.argv[1]); assert d["engine"] == sys.argv[2]; assert d["workflowDsl"] == "1.0.3"; assert d["features"]["scheduling"] == {"after": True, "every": True, "cron": True, "on": True, "durable": True, "owner": "fenced_workers"}' "$capabilities" "${{ matrix.engine }}"
          curl --fail --silent --request POST --header 'content-type: application/json' \
            --data '{"input":{"question":"postgres-after-restart"}}' \
            "http://127.0.0.1:${{ matrix.port }}/v1/invoke" \
            | python -c 'import json, sys; d=json.load(sys.stdin); assert d["status"] == "completed"'
      - name: Upload PostgreSQL container logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-${{ matrix.engine }}-postgres-logs
          path: ${{ runner.temp }}/owa-${{ matrix.engine }}-postgres*.log
          if-no-files-found: ignore

  s4-06-matched-benchmark:
    if: github.event_name == 'workflow_dispatch' || vars.OWA_AUTOMATIC_CI == 'true'
    name: S4-06 matched ${{ matrix.engine }} measurements
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - engine: adk
            extra: native
          - engine: langgraph
            extra: sqlite
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: owa
          POSTGRES_PASSWORD: owa
          POSTGRES_DB: owa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U owa -d owa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      OWA_TEST_POSTGRES_URL: postgresql://owa:owa@127.0.0.1:5432/owa
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install Python
        run: uv python install "$PYTHON_VERSION"
      - name: Run matched SQLite and PostgreSQL profiles
        shell: bash
        run: |
          set -euo pipefail
          uv run --directory engines/${{ matrix.engine }} --locked --exact \
            --extra knowledge --extra ${{ matrix.extra }} --extra postgres \
            python ../../benchmarks/matched.py --engine ${{ matrix.engine }} --backend sqlite \
            --iterations 30 --warmups 5 --concurrency 8 --recovery-samples 3 \
            --output "$RUNNER_TEMP/matched-${{ matrix.engine }}-sqlite.json"
          timeout --signal=TERM --kill-after=30s 12m \
            uv run --directory engines/${{ matrix.engine }} --locked --exact \
            --extra knowledge --extra ${{ matrix.extra }} --extra postgres \
            python ../../benchmarks/matched.py --engine ${{ matrix.engine }} --backend postgresql \
            --iterations 30 --warmups 5 --concurrency 8 --recovery-samples 3 \
            --output "$RUNNER_TEMP/matched-${{ matrix.engine }}-postgresql.json"
      - name: Upload matched engine profiles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matched-benchmark-${{ matrix.engine }}
          path: ${{ runner.temp }}/matched-${{ matrix.engine }}-*.json
          if-no-files-found: error

  s4-06-benchmark-report:
    name: S4-06 aggregate benchmark report
    runs-on: ubuntu-latest
    needs: [s4-06-matched-benchmark]
    if: (github.event_name == 'workflow_dispatch' || vars.OWA_AUTOMATIC_CI == 'true') && (needs.s4-06-matched-benchmark.result == 'success')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install Python
        run: uv python install "$PYTHON_VERSION"
      - name: Download all four engine/backend profiles
        uses: actions/download-artifact@v8
        with:
          pattern: matched-benchmark-*
          path: ${{ runner.temp }}/matched-profiles
          merge-multiple: true
      - name: Validate and aggregate matched measurements
        run: |
          set -euo pipefail
          uv run --locked python benchmarks/aggregate_matched.py \
            --inputs ${{ runner.temp }}/matched-profiles/matched-*.json \
            --output "$RUNNER_TEMP/s4-06-matched-report.json"
      - name: Upload aggregate S4-06 report
        uses: actions/upload-artifact@v7
        with:
          name: s4-06-matched-performance-report
          path: ${{ runner.temp }}/s4-06-matched-report.json
          if-no-files-found: error
