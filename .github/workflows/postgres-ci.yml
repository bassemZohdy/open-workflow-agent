permissions:
  contents: read

concurrency:
  group: postgres-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  postgres-core:
    if: github.event_name == 'workflow_dispatch' || vars.OWA_AUTOMATIC_CI == 'true'
    name: PostgreSQL common-store integration
    runs-on: ubuntu-latest
    # Each SDK has a fresh database and bounded independent recovery job.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: owa
          POSTGRES_PASSWORD: owa
          POSTGRES_DB: owa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U owa -d owa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install Python
        run: uv python install "$PYTHON_VERSION"
      - name: Run isolated PostgreSQL store tests
        env:
          OWA_TEST_POSTGRES_URL: postgresql://owa:owa@127.0.0.1:5432/owa
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 12m \
            uv run --locked --extra knowledge --extra postgres pytest tests/core/test_postgres_persistence.py \
            tests/core/test_effect_journal.py \
            tests/core/test_lifecycle_history.py \
            tests/core/test_external_recovery.py \
            tests/core/test_recovery_definitions.py \
            tests/core/test_recovery_sdk_inventory.py \
            tests/core/test_recovery_cooperation.py \
            tests/core/test_grpc_completion_fence.py \
            tests/core/test_recovery_diagnostics.py \
            tests/core/test_timer_archive_preflight.py \
            tests/core/test_schedule_archive_preflight.py \
            tests/core/test_initial_delivery.py \
            tests/core/test_openapi_admission.py \
            tests/core/test_executable_source_admission.py \
            tests/core/test_sandbox_jobs.py \
            tests/core/test_sandbox_job_dispatcher.py \
            tests/core/test_background_job_runtime.py \
            tests/core/test_a2a_card_admission.py \
            tests/core/test_invocation_cancellation_controls.py \
            tests/core/test_policy_decisions.py \
            tests/core/test_event_store.py \
            tests/core/test_durable_event_api.py \
            tests/core/test_durable_event_approvals.py \
            tests/core/test_protected_approval_dynamic.py \
            tests/core/test_protected_approvals.py \
            tests/core/test_approval_dispatcher.py \
            tests/core/test_protected_approval_recovery.py \
            tests/core/test_execution_authority.py \
            tests/core/test_execution_authorization.py \
            tests/core/test_execution_context_isolation.py \
            tests/core/test_memory_namespaces.py \
            tests/core/test_credential_projection.py \
            tests/core/test_api_execution_authority.py \
            tests/core/test_authenticated_catalog_metadata.py \
            tests/core/test_agent_roles.py \
            tests/core/test_agent_role_boundaries.py \
            tests/core/test_bounded_memory.py \
            tests/core/test_provider_model_spi.py \
            tests/core/test_provider_service_composition.py \
            tests/core/test_event_transport.py \
            tests/core/test_timer_store.py \
            tests/core/test_child_workflow_budgets.py \
            tests/core/test_child_delivery_guards.py \
            tests/core/test_child_wait_store.py \
            tests/core/test_child_control_validation.py \
            tests/core/test_child_rescan.py \
            tests/core/test_child_event_dependencies.py \
            tests/core/test_child_terminal_provenance.py \
            tests/core/test_timer_dispatcher_ownership.py \
            tests/core/test_schedule_store.py \
            tests/core/test_event_triggers.py \
            tests/core/test_execution_ownership.py tests/core/test_execution_ownership_fences.py \
            tests/core/test_action_progress_ownership.py -vv --durations=20
  postgres-langgraph:
    if: github.event_name == 'workflow_dispatch' || vars.OWA_AUTOMATIC_CI == 'true'
    name: PostgreSQL LangGraph native recovery
    runs-on: ubuntu-latest
    # Each SDK has a fresh database and bounded independent recovery job.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: owa
          POSTGRES_PASSWORD: owa
          POSTGRES_DB: owa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U owa -d owa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install Python
        run: uv python install "$PYTHON_VERSION"
      - name: Verify native LangGraph task checkpoints and interrupted restart
        env:
          OWA_TEST_POSTGRES_URL: postgresql://owa:owa@127.0.0.1:5432/owa
          OWA_TEST_REQUIRED_ENGINE: langgraph
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 5m \
            uv run --directory engines/langgraph --locked --exact --extra knowledge --extra postgres \
            --with pytest --with pytest-asyncio pytest ../../tests/langgraph/test_native_task_graph.py \
            ../../tests/langgraph/test_native_send.py \
            ../../tests/contract/test_native_channel_process_recovery.py -vv --durations=20
      - name: Verify competitive fork and invocation recovery on native LangGraph with PostgreSQL
        env:
          OWA_TEST_POSTGRES_URL: postgresql://owa:owa@127.0.0.1:5432/owa
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 30m \
            uv run --directory engines/langgraph --locked --exact --extra knowledge --extra postgres \
            --with pytest --with pytest-asyncio pytest ../../tests/contract/test_competitive_forks.py \
            ../../tests/contract/test_checkpoint_recovery.py \
            ../../tests/contract/test_recovery_admission.py \
            ../../tests/contract/test_runtime_execution_ownership.py \
            ../../tests/contract/test_action_execution_authority.py \
            ../../tests/contract/test_native_checkpoint_fencing.py \
            ../../tests/contract/test_native_state_consistency.py \
            ../../tests/contract/test_native_receipt_consistency.py \
            ../../tests/contract/test_native_receipt_fork_consistency.py \
            ../../tests/contract/test_native_scope_dependencies.py \
            ../../tests/contract/test_sandbox_effect_recovery.py \
            ../../tests/contract/test_event_child_effect_recovery.py \
            ../../tests/contract/test_child_invocation_dependencies.py \
            ../../tests/contract/test_detached_children.py \
            ../../tests/contract/test_recursive_children.py \
            ../../tests/contract/test_synchronous_child_waits.py \
            ../../tests/contract/test_child_lifecycle_acceptance.py \
            ../../tests/contract/test_detached_child_process_recovery.py \
            ../../tests/contract/test_retry_error_context.py \
            ../../tests/contract/test_retry_timing.py \
            ../../tests/contract/test_deadline_recovery.py \
            ../../tests/contract/test_retry_schedule_recovery.py \
            ../../tests/contract/test_timing_process_recovery.py \
            ../../tests/contract/test_durable_events.py \
            ../../tests/contract/test_durable_event_process_recovery.py \
            ../../tests/contract/test_durable_timers.py \
            ../../tests/contract/test_durable_timer_forks.py \
            ../../tests/contract/test_durable_timer_process_recovery.py \
            ../../tests/contract/test_durable_scheduling.py \
            ../../tests/contract/test_schedule_event_triggers.py \
            ../../tests/contract/test_process_crash_recovery.py \
            ../../tests/contract/test_effect_recovery.py \
            ../../tests/contract/test_invocation_writes.py \
            -k 'postgresql and (langgraph or completed_native_scope_dependencies)' -vv --durations=20
  postgres-native-replay:
    if: github.event_name == 'workflow_dispatch' || vars.OWA_AUTOMATIC_CI == 'true'
    name: PostgreSQL native state replay
    runs-on: ubuntu-latest
    # Public replay over the native checkpoint store: HTTP, process stops and lifecycle,
    # each on a fresh SQLite directory or this database.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
