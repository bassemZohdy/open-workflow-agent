name: PostgreSQL CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/postgres-ci.yml"
      - "core/src/open_workflow_agent/persistence.py"
      - "core/src/open_workflow_agent/storage.py"
      - "core/src/open_workflow_agent/services.py"
      - "core/src/open_workflow_agent/config.py"
      - "core/src/open_workflow_agent/approvals.py"
      - "core/src/open_workflow_agent/scheduling.py"
      - "engines/adk/src/open_workflow_agent_adk/__init__.py"
      - "engines/adk/src/open_workflow_agent_adk/native.py"
      - "engines/langgraph/src/open_workflow_agent_langgraph/__init__.py"
      - "engines/langgraph/src/open_workflow_agent_langgraph/native.py"
      - "tests/core/test_postgres_persistence.py"
      - "docker/Dockerfile.adk"
      - "docker/Dockerfile.langgraph"
      - "pyproject.toml"
      - "core/pyproject.toml"
      - "engines/adk/pyproject.toml"
      - "engines/langgraph/pyproject.toml"
      - "uv.lock"
      - "engines/adk/uv.lock"
      - "engines/langgraph/uv.lock"
  pull_request:
    paths:
      - ".github/workflows/postgres-ci.yml"
      - "core/src/open_workflow_agent/persistence.py"
      - "core/src/open_workflow_agent/storage.py"
      - "core/src/open_workflow_agent/services.py"
      - "core/src/open_workflow_agent/config.py"
      - "core/src/open_workflow_agent/approvals.py"
      - "core/src/open_workflow_agent/scheduling.py"
      - "engines/adk/src/open_workflow_agent_adk/__init__.py"
      - "engines/adk/src/open_workflow_agent_adk/native.py"
      - "engines/langgraph/src/open_workflow_agent_langgraph/__init__.py"
      - "engines/langgraph/src/open_workflow_agent_langgraph/native.py"
      - "tests/core/test_postgres_persistence.py"
      - "docker/Dockerfile.adk"
      - "docker/Dockerfile.langgraph"
      - "pyproject.toml"
      - "core/pyproject.toml"
      - "engines/adk/pyproject.toml"
      - "engines/langgraph/pyproject.toml"
      - "uv.lock"
      - "engines/adk/uv.lock"
      - "engines/langgraph/uv.lock"

permissions:
  contents: read

concurrency:
  group: postgres-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.12"

jobs:
  postgres-core:
    name: PostgreSQL common-store integration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: owa
          POSTGRES_PASSWORD: owa
          POSTGRES_DB: owa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U owa -d owa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install Python
        run: uv python install "$PYTHON_VERSION"
      - name: Run isolated PostgreSQL store tests
        env:
          OWA_TEST_POSTGRES_URL: postgresql://owa:owa@127.0.0.1:5432/owa
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 5m \
            uv run --locked --extra postgres pytest tests/core/test_postgres_persistence.py -vv --durations=20

  postgres-runtime:
    name: PostgreSQL persistence ${{ matrix.engine }} acceptance
    runs-on: ubuntu-latest
    needs: postgres-core
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        include:
          - engine: adk
            port: 18180
          - engine: langgraph
            port: 18181
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: owa
          POSTGRES_PASSWORD: owa
          POSTGRES_DB: owa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U owa -d owa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build PostgreSQL-enabled runtime image
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 12m \
            docker build --build-arg OWA_VERSION=0.1.0 --build-arg VCS_REF=${{ github.sha }} \
            --file docker/Dockerfile.${{ matrix.engine }} \
            --tag owa-${{ matrix.engine }}:postgres-${{ github.sha }} .
      - name: Start, restart, and invoke against PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          mkdir -p "$workdir/config" "$workdir/knowledge" "$workdir/data"
          chmod 0777 "$workdir/data"
          cat > "$workdir/config/agent.yaml" <<'YAML'
          model:
            provider: fake
            name: fake/default
          persistence:
            datasource: postgresql://owa:owa@host.docker.internal:5432/owa
          knowledge:
            path: /knowledge
            reload:
              mode: startup
          YAML
          printf '%s\n' 'PostgreSQL persistence acceptance document.' > "$workdir/knowledge/policy.md"
          name="owa-${{ matrix.engine }}-postgres"
          restarted_name="${name}-restarted"
          log_file="$RUNNER_TEMP/owa-${{ matrix.engine }}-postgres.log"
          restarted_log_file="$RUNNER_TEMP/owa-${{ matrix.engine }}-postgres-restarted.log"
          cleanup() {
            docker logs "$name" > "$log_file" 2>&1 || true
            docker logs "$restarted_name" > "$restarted_log_file" 2>&1 || true
            docker rm --force "$name" "$restarted_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          run_args=(
            --read-only
            --tmpfs /tmp:rw,nosuid,nodev,size=256m
            --user 12345:0
            --add-host host.docker.internal:host-gateway
            --volume "$workdir/config:/config:ro"
            --volume "$workdir/knowledge:/knowledge:ro"
            --volume "$workdir/data:/data:rw"
          )
          docker run --detach --name "$name" --publish ${{ matrix.port }}:8080 "${run_args[@]}" \
            "owa-${{ matrix.engine }}:postgres-${{ github.sha }}"
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:${{ matrix.port }}/health/ready" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "http://127.0.0.1:${{ matrix.port }}/health/ready" >/dev/null
          invocation="$(curl --fail --silent --request POST --header 'content-type: application/json' \
            --data '{"input":{"question":"postgres"}}' \
            "http://127.0.0.1:${{ matrix.port }}/v1/invoke")"
          python -c 'import json, sys; d=json.loads(sys.argv[1]); assert d["status"] == "completed"; assert d["output"]["response"]["question"] == "postgres"' "$invocation"
          docker stop --time 5 "$name" >/dev/null
          docker rm "$name" >/dev/null
          docker run --detach --name "$restarted_name" --publish ${{ matrix.port }}:8080 "${run_args[@]}" \
            "owa-${{ matrix.engine }}:postgres-${{ github.sha }}"
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:${{ matrix.port }}/health/ready" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "http://127.0.0.1:${{ matrix.port }}/health/ready" >/dev/null
          curl --fail --silent --request POST --header 'content-type: application/json' \
            --data '{"input":{"question":"postgres-after-restart"}}' \
            "http://127.0.0.1:${{ matrix.port }}/v1/invoke" \
            | python -c 'import json, sys; d=json.load(sys.stdin); assert d["status"] == "completed"'
      - name: Upload PostgreSQL container logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-${{ matrix.engine }}-postgres-logs
          path: ${{ runner.temp }}/owa-${{ matrix.engine }}-postgres*.log
          if-no-files-found: ignore
