name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  IMAGE_SIZE_LIMIT_BYTES: "2147483648"

jobs:
  root:
    name: Root quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install "$PYTHON_VERSION"
      - name: Sync locked root environment
        run: uv sync --locked
      - name: Check root lock
        run: uv lock --check
      - name: Format
        run: uv run --locked ruff format --check core engines tests
      - name: Lint
        run: uv run --locked ruff check .
      - name: Type check
        run: uv run --locked mypy core/src
      - name: Tests
        run: uv run --locked pytest -q
      - name: Shared contract tests
        run: uv run --locked pytest tests/contract -q
      - name: Build root and standalone core artifacts
        run: |
          uv build
          uv build --directory core
      - name: Validate wheel contents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = sorted(Path("dist").glob("*.whl"))
          assert wheels, "no wheels were built"
          for wheel in wheels:
              with zipfile.ZipFile(wheel) as archive:
                  names = archive.namelist()
                  assert any(name.endswith("open_workflow_agent/__init__.py") for name in names)
                  assert any("open_workflow_schema_1.0.3.json" in name for name in names)
          PY

  engines:
    name: ${{ matrix.engine }} native and contract tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: adk
            extra: native
            test_dir: adk
          - engine: langgraph
            extra: sqlite
            test_dir: langgraph
    defaults:
      run:
        working-directory: engines/${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install "$PYTHON_VERSION"
      - name: Check engine lock
        run: uv lock --check
      - name: Native and shared contract tests
        run: uv run --locked --extra ${{ matrix.extra }} --with pytest --with pytest-asyncio pytest ../../tests/${{ matrix.test_dir }} ../../tests/contract ../../tests/ctk -q

  containers:
    name: Docker ${{ matrix.engine }} acceptance
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: adk
            port: 18080
          - engine: langgraph
            port: 18081
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build independent runtime image
        run: docker build --file docker/Dockerfile.${{ matrix.engine }} --tag owa-${{ matrix.engine }}:${{ github.sha }} .
      - name: Enforce image-size gate
        shell: bash
        run: |
          set -euo pipefail
          size="$(docker image inspect --format '{{.Size}}' owa-${{ matrix.engine }}:${{ github.sha }})"
          echo "owa-${{ matrix.engine }} size: ${size} bytes"
          if (( size > IMAGE_SIZE_LIMIT_BYTES )); then
            echo "image exceeds ${IMAGE_SIZE_LIMIT_BYTES}-byte limit" >&2
            exit 1
          fi
          {
            echo "### Docker image"
            echo "- Engine: ${{ matrix.engine }}"
            echo "- Size: ${size} bytes"
            echo "- Limit: ${IMAGE_SIZE_LIMIT_BYTES} bytes"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Container startup, health, capabilities, invocation, and knowledge
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          mkdir -p "$workdir/config" "$workdir/knowledge" "$workdir/data"
          cat > "$workdir/config/agent.yaml" <<'YAML'
          model:
            provider: fake
            name: fake/default
          knowledge:
            path: /knowledge
            database: /data/knowledge.sqlite3
            reload:
              mode: startup
          YAML
          printf '%s\n' 'CI knowledge acceptance document.' > "$workdir/knowledge/policy.md"
          name="owa-${{ matrix.engine }}-ci"
          log_file="$RUNNER_TEMP/owa-${{ matrix.engine }}-container.log"
          docker run --detach --rm --name "$name" --publish ${{ matrix.port }}:8080 \
            --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m --user 12345:0 \
            --volume "$workdir/config:/config:ro" \
            --volume "$workdir/knowledge:/knowledge:ro" \
            --volume "$workdir/data:/data:rw" \
            "owa-${{ matrix.engine }}:${{ github.sha }}"
          cleanup() {
            docker logs "$name" > "$log_file" 2>&1 || true
            docker rm --force "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:${{ matrix.port }}/health/ready" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "http://127.0.0.1:${{ matrix.port }}/health/live" >/dev/null
          curl --fail --silent "http://127.0.0.1:${{ matrix.port }}/health/ready" >/dev/null
          capabilities="$(curl --fail --silent "http://127.0.0.1:${{ matrix.port }}/v1/capabilities")"
          python -c 'import json, sys; d=json.loads(sys.argv[1]); assert d["engine"] == sys.argv[2]; assert d["workflowDsl"] == "1.0.3"; assert d["features"]["resume"] is True' "$capabilities" "${{ matrix.engine }}"
          invocation="$(curl --fail --silent --request POST --header 'content-type: application/json' --data '{"input":{"question":"ci"}}' "http://127.0.0.1:${{ matrix.port }}/v1/invoke")"
          python -c 'import json, sys; d=json.loads(sys.argv[1]); assert d["status"] == "completed"; assert d["output"]["response"]["question"] == "ci"' "$invocation"
          reload="$(curl --fail --silent --request POST "http://127.0.0.1:${{ matrix.port }}/v1/admin/knowledge/reload")"
          python -c 'import json, sys; d=json.loads(sys.argv[1]); assert d["added"] == 0; assert d["unchanged"] == 1' "$reload"
      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-${{ matrix.engine }}-logs
          path: ${{ runner.temp }}/owa-${{ matrix.engine }}-container.log
          if-no-files-found: ignore
