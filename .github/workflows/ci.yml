name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.12"
  IMAGE_SIZE_LIMIT_BYTES: "2147483648"

jobs:
  windows-expressions:
    name: Windows jq expression and admission tests
    runs-on: windows-latest
    # Independent jobs keep both selections required without making one
    # consume the other's bounded time for process-stop/recovery acceptance.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install Python
        run: uv python install "${{ env.PYTHON_VERSION }}"
      - name: Sync locked expression environment
        run: uv sync --locked
      - name: Verify native jq cleanup, data semantics and shared admission
        run: >-
          uv run --locked pytest -q
          tests/core/test_expressions.py
          tests/core/test_workflow.py
          tests/core/test_sandbox_validation.py
          tests/core/test_execution_ownership_fences.py
          tests/core/test_action_progress_ownership.py
          tests/core/test_native_write_fence_storage.py
          tests/core/test_native_sqlite_inspection.py
          tests/contract/test_jq_portability.py
          tests/contract/test_data_pipeline.py
          tests/contract/test_scoped_flow.py
          tests/contract/test_reusable_definitions.py
          tests/contract/test_catalog_bindings.py
          tests/contract/test_schema_reference_closure.py
          tests/contract/test_schema_resources.py
          tests/contract/test_definition_admission.py
  windows-native:
    name: Windows native task checkpoints and routing
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install Python
        run: uv python install "${{ env.PYTHON_VERSION }}"
      - name: Sync locked expression environment
        run: uv sync --locked
      - name: Verify Windows native task checkpoints and routing
        run: >-
          uv run --directory engines/langgraph --locked --extra sqlite
          --with pytest --with pytest-asyncio pytest -q
          ../../tests/langgraph/test_native_task_graph.py
          ../../tests/contract/test_scoped_flow.py
          ../../tests/contract/test_data_pipeline.py
          ../../tests/contract/test_reusable_definitions.py
          ../../tests/contract/test_catalog_bindings.py
          ../../tests/contract/test_schema_resources.py

  windows-native-recovery:
    name: Windows native ownership and effect recovery
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install Python
        run: uv python install "${{ env.PYTHON_VERSION }}"
      - name: Sync locked expression environment
        run: uv sync --locked
      - name: Verify Windows native ownership and effect recovery
        run: >-
          uv run --directory engines/langgraph --locked --extra sqlite
          --with pytest --with pytest-asyncio pytest -q
          ../../tests/contract/test_process_crash_recovery.py
          ../../tests/contract/test_runtime_execution_ownership.py
          ../../tests/contract/test_action_execution_authority.py
          ../../tests/contract/test_native_checkpoint_fencing.py
          ../../tests/contract/test_native_state_consistency.py
          ../../tests/contract/test_native_receipt_consistency.py
          ../../tests/contract/test_native_receipt_fork_consistency.py
          ../../tests/contract/test_native_scope_dependencies.py
          ../../tests/contract/test_sandbox_effect_recovery.py
          ../../tests/contract/test_event_child_effect_recovery.py
          ../../tests/contract/test_child_invocation_dependencies.py

  windows-native-timing:
    name: Windows native timers events and scheduling
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install Python
        run: uv python install "${{ env.PYTHON_VERSION }}"
      - name: Sync locked expression environment
        run: uv sync --locked
      - name: Verify Windows native timers events and scheduling
        run: >-
          uv run --directory engines/langgraph --locked --extra sqlite
          --with pytest --with pytest-asyncio pytest -q
          ../../tests/contract/test_detached_children.py
          ../../tests/contract/test_synchronous_child_waits.py
          ../../tests/contract/test_child_lifecycle_acceptance.py
          ../../tests/contract/test_detached_child_process_recovery.py
          ../../tests/contract/test_retry_error_context.py
          ../../tests/contract/test_retry_timing.py
          ../../tests/contract/test_deadline_recovery.py
          ../../tests/contract/test_retry_schedule_recovery.py
          ../../tests/contract/test_scoped_exception_policies.py
          ../../tests/contract/test_timing_process_recovery.py
          ../../tests/contract/test_durable_events.py
          ../../tests/contract/test_durable_event_process_recovery.py
          ../../tests/contract/test_durable_timers.py
          ../../tests/contract/test_durable_timer_forks.py
          ../../tests/contract/test_durable_timer_process_recovery.py
          ../../tests/contract/test_durable_scheduling.py
          ../../tests/contract/test_schedule_event_triggers.py
          ../../tests/contract/test_event_backend_admission.py

  windows-native-lifecycle:
    name: Windows native lifecycle and receiver recovery
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install Python
        run: uv python install "${{ env.PYTHON_VERSION }}"
      - name: Sync locked expression environment
        run: uv sync --locked
      - name: Verify Windows native lifecycle and receiver recovery
        run: >-
          uv run --directory engines/langgraph --locked --extra sqlite
          --with pytest --with pytest-asyncio pytest -vv --durations=20
          ../../tests/contract/test_external_operation_keys.py
          ../../tests/contract/test_external_recovery_process.py
          ../../tests/contract/test_external_recovery_native_corruption.py
          ../../tests/contract/test_host_drain_child_controls.py
          ../../tests/contract/test_explicit_compensation.py
          ../../tests/contract/test_workflow_version_recovery.py
          ../../tests/contract/test_workflow_version_process_recovery.py
          ../../tests/contract/test_mcp_sdk_calls.py
          ../../tests/contract/test_mcp_stdio_integration.py
          ../../tests/contract/test_a2a_workflow_calls.py
          ../../tests/contract/test_a2a_sdk_inbound.py
          ../../tests/contract/test_a2a_initial_delivery.py
          ../../tests/core/test_native_sqlite_inspection.py

  windows-mcp:
    name: Windows common MCP transport and authentication controls
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install Python
        run: uv python install "${{ env.PYTHON_VERSION }}"
      - name: Sync locked common SDK environment
        run: uv sync --locked
      - name: Verify Windows common MCP and process lifetime controls
        run: >-
          uv run --locked pytest -vv --durations=20
          tests/core/test_mcp_sdk_http.py
          tests/core/test_async_authentication.py
          tests/core/test_authentication_tls.py
          tests/core/test_sandbox_stdio.py
          tests/core/test_mcp_stdio_frames.py
          tests/core/test_mcp_deployment_admission.py
          tests/core/test_mcp_capabilities.py
          tests/core/test_a2a_sdk_http.py
          tests/core/test_a2a_inbound_v1.py
          tests/core/test_a2a_card_admission.py
          tests/core/test_initial_delivery.py
          tests/core/test_native_sqlite_inspection.py
          tests/contract/test_mcp_stdio_integration.py

  manifests:
    name: Validate deployment manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install kubeconform
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz" \
            | tar -C /usr/local/bin -xz kubeconform
          kubeconform -v
      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.17.3
      - name: Lint Helm chart
        run: helm lint deploy/helm/open-workflow-agent
      - name: Validate deploy manifests
        shell: bash
        run: |
          set -euo pipefail
          # Project, HTTPRoute, ServiceMonitor, and PrometheusRule are
          # external/OpenShift API kinds; vanilla Kubernetes schemas do not
          # carry them, so they are skipped explicitly rather than silently
          # ignoring unknown kinds. Targeted repository tests validate their
          # deployment-owned fields.
          kubeconform -strict -summary -kubernetes-version 1.31.0 -skip Project,HTTPRoute,ServiceMonitor,PrometheusRule deploy/kubernetes deploy/openshift
      - name: Validate rendered Helm release
        shell: bash
        run: |
          set -euo pipefail
          helm template owa deploy/helm/open-workflow-agent --namespace owa \
            | kubeconform -strict -summary -kubernetes-version 1.31.0

  root:
    name: Root quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install Python
        run: uv python install "$PYTHON_VERSION"
      - name: Sync locked root environment
        run: uv sync --locked --extra knowledge
      - name: Check root lock
        run: uv lock --check
      - name: Validate embedded and optional PostgreSQL Compose profiles
        run: |
          docker compose --env-file .env.example --profile adk --profile langgraph config --quiet
          docker compose --env-file .env.example -f compose.yaml -f compose.postgres.yaml --profile adk --profile langgraph config --quiet
          test "$(docker compose --env-file .env.example --profile adk config --services)" = adk
          test "$(docker compose --env-file .env.example --profile langgraph config --services)" = langgraph
      - name: Format
        run: uv run --locked ruff format --check ci core engines tests
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check shell acceptance scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in tests/ci/*.sh; do
            bash -n "$script"
          done
      - name: Type check
        run: |
          uv run --locked mypy ci
          uv run --locked mypy \
            --package open_workflow_agent \
            --package open_workflow_agent_adk \
            --package open_workflow_agent_langgraph \
            --package open_workflow_agent_agent_framework
      - name: Tests
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 8m \
            uv run --locked pytest tests -vv --durations=20 \
              --cov=core/src/open_workflow_agent --cov-report=term-missing \
              --cov-fail-under=90
      # The full tests/ selection above includes all shared contract fixtures.
      # Native adapters each run that same contract suite in their own locked env.
      - name: Build root and standalone core artifacts
        run: |
          uv build
          uv build --directory core
      - name: Verify release metadata and lock inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import tomllib
          from pathlib import Path

          import re

          expected = tomllib.loads(Path("pyproject.toml").read_text())['project']['version']
          for path in ("core/pyproject.toml", "engines/adk/pyproject.toml", "engines/langgraph/pyproject.toml"):
              actual = tomllib.loads(Path(path).read_text())['project']['version']
              assert actual == expected, f"{path} has version {actual}, expected {expected}"
          runtime = re.search(r'__version__ = "([^"]+)"', Path("core/src/open_workflow_agent/_version.py").read_text())
          assert runtime and runtime.group(1) == expected, (
              f"core/src/open_workflow_agent/_version.py has {runtime.group(1) if runtime else 'no version'}, expected {expected}"
          )
          print(f"release version: {expected}")
          PY
          uv lock --check
          uv lock --directory core --check
          uv lock --directory engines/adk --check
          uv lock --directory engines/langgraph --check
      - name: Validate wheel contents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = sorted(Path("dist").glob("*.whl")) + sorted(Path("core/dist").glob("*.whl"))
          assert wheels, "no wheels were built"
          for wheel in wheels:
              with zipfile.ZipFile(wheel) as archive:
                  names = archive.namelist()
                  assert any(name.endswith("open_workflow_agent/__init__.py") for name in names)
                  schema = "open_workflow_agent/_resources/open-workflow/1.0.3/workflow.yaml"
                  assert schema in names, f"missing packaged Open Workflow schema in {wheel.name}"
          PY
          python ci/recovery_build.py --project . --dist dist
          python ci/recovery_build.py --project core --dist core/dist

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install Python
        run: uv python install "$PYTHON_VERSION"
      - name: Sync mutation environment
        run: uv sync --locked --group mutation
      - name: Stage source-root layout for mutmut
        run: cp -R core/src src
      - name: Run focused mutation suite
        run: uv run --locked --group mutation mutmut run
      - name: Report mutation results
        if: always()
        run: uv run --locked --group mutation mutmut results

  engines:
    name: ${{ matrix.engine }} native and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: adk
            extra: native
            test_dir: adk
          - engine: langgraph
            extra: sqlite
            test_dir: langgraph
    defaults:
      run:
        working-directory: engines/${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install Python
        run: uv python install "$PYTHON_VERSION"
      - name: Check engine lock
        run: uv lock --check
      - name: Native and shared contract tests
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 8m \
            uv run --locked --extra knowledge --extra ${{ matrix.extra }} --with pytest --with pytest-asyncio \
            pytest ../../tests/${{ matrix.test_dir }} ../../tests/contract -vv --durations=20 \
            --ignore=../../tests/contract/test_external_operation_keys.py \
            --ignore=../../tests/contract/test_external_recovery_process.py \
            --ignore=../../tests/contract/test_external_recovery_native_corruption.py \
            --ignore=../../tests/contract/test_host_drain_child_controls.py \
            --ignore=../../tests/contract/test_explicit_compensation.py \
            --ignore=../../tests/contract/test_workflow_version_recovery.py \
            --ignore=../../tests/contract/test_workflow_version_process_recovery.py \
            --ignore=../../tests/contract/test_mcp_sdk_calls.py \
            --ignore=../../tests/contract/test_mcp_stdio_integration.py \
            --ignore=../../tests/contract/test_a2a_workflow_calls.py \
            --ignore=../../tests/contract/test_a2a_sdk_inbound.py \
            --ignore=../../tests/contract/test_a2a_initial_delivery.py
      - name: Portable Profile CTK subset
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 5m \
            uv run --locked --extra knowledge --extra ${{ matrix.extra }} --with pytest --with pytest-asyncio \
            pytest ../../tests/ctk -vv --durations=20 | tee "$RUNNER_TEMP/ctk-${{ matrix.engine }}.log"
      - name: Capture CTK provenance
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "repository_commit=$(git rev-parse HEAD)"
            sed -n '1,8p' ../../tests/ctk/README.md
            echo "scenario_sha256="
            sha256sum ../../tests/ctk/features/*.feature
          } > "$RUNNER_TEMP/ctk-${{ matrix.engine }}-provenance.txt"
      - name: Upload CTK results and provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ctk-${{ matrix.engine }}-results
          path: |
            ${{ runner.temp }}/ctk-${{ matrix.engine }}.log
            ${{ runner.temp }}/ctk-${{ matrix.engine }}-provenance.txt
          if-no-files-found: warn
      - name: Engine-specific benchmark probes
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 5m \
            uv run --locked --extra knowledge --extra ${{ matrix.extra }} \
            python ../../benchmarks/engines.py \
              --engine ${{ matrix.engine }} --iterations 10 --concurrency 4 \
            | tee "$RUNNER_TEMP/engine-benchmark-${{ matrix.engine }}.json"
      - name: Upload engine benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-benchmark-${{ matrix.engine }}
          path: ${{ runner.temp }}/engine-benchmark-${{ matrix.engine }}.json
          if-no-files-found: warn

  native-lifecycle:
    name: ${{ matrix.engine }} native lifecycle and version recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: adk
            extra: native
          - engine: langgraph
            extra: sqlite
    defaults:
      run:
        working-directory: engines/${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.26"
          enable-cache: true
      - name: Install Python
        run: uv python install "$PYTHON_VERSION"
      - name: Native lifecycle and original-definition contract tests
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 8m \
            uv run --locked --extra knowledge --extra ${{ matrix.extra }} \
            --with pytest --with pytest-asyncio pytest \
            ../../tests/contract/test_external_operation_keys.py \
            ../../tests/contract/test_external_recovery_process.py \
            ../../tests/contract/test_external_recovery_native_corruption.py \
            ../../tests/contract/test_host_drain_child_controls.py \
            ../../tests/contract/test_explicit_compensation.py \
            ../../tests/contract/test_workflow_version_recovery.py \
            ../../tests/contract/test_workflow_version_process_recovery.py \
            ../../tests/contract/test_mcp_sdk_calls.py \
            ../../tests/contract/test_mcp_stdio_integration.py \
            ../../tests/contract/test_a2a_workflow_calls.py \
            ../../tests/contract/test_a2a_sdk_inbound.py \
            ../../tests/contract/test_a2a_initial_delivery.py \
            ../../tests/core/test_native_sqlite_inspection.py -vv --durations=20

  containers:
    # Principal lifecycle/process fixtures run in the independent job above.
    name: Docker ${{ matrix.engine }} acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: adk
            port: 18080
            resume_port: 19080
            sandbox_port: 20080
          - engine: langgraph
            port: 18081
            resume_port: 19081
            sandbox_port: 20081
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build independent runtime image
        shell: bash
        run: |
          set -euo pipefail
          owa_version="$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')"
          timeout --signal=TERM --kill-after=30s 12m \
            docker build --build-arg OWA_VERSION="$owa_version" --build-arg VCS_REF=${{ github.sha }} \
            --file docker/Dockerfile.${{ matrix.engine }} \
            --tag owa-${{ matrix.engine }}:${{ github.sha }} .
      - name: Verify image metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "owa-${{ matrix.engine }}:${{ github.sha }}")"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "owa-${{ matrix.engine }}:${{ github.sha }}")"
          expected_version="$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')"
          test "$version" = "$expected_version"
          test "$revision" = "${{ github.sha }}"
      - name: Enforce image-size gate
        shell: bash
        run: |
          set -euo pipefail
          size="$(docker image inspect --format '{{.Size}}' owa-${{ matrix.engine }}:${{ github.sha }})"
          echo "owa-${{ matrix.engine }} size: ${size} bytes"
          if (( size > IMAGE_SIZE_LIMIT_BYTES )); then
            echo "image exceeds ${IMAGE_SIZE_LIMIT_BYTES}-byte limit" >&2
            exit 1
          fi
          {
            echo "### Docker image"
            echo "- Engine: ${{ matrix.engine }}"
            echo "- Size: ${size} bytes"
            echo "- Limit: ${IMAGE_SIZE_LIMIT_BYTES} bytes"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: External catalog resolver acceptance inside release image
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 5m \
            bash tests/ci/container_catalog_image_acceptance.sh \
            "${{ matrix.engine }}" "owa-${{ matrix.engine }}:${{ github.sha }}"
      - name: Internal sandbox execution acceptance inside release image
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 8m \
            bash tests/ci/container_sandbox_image_acceptance.sh \
            "${{ matrix.engine }}" "owa-${{ matrix.engine }}:${{ github.sha }}" \
            "${{ matrix.sandbox_port }}"
      - name: One-container embedded defaults without configuration or credentials
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 5m \
            bash tests/ci/container_embedded_defaults_acceptance.sh \
            "${{ matrix.engine }}" "owa-${{ matrix.engine }}:${{ github.sha }}" \
            "${{ matrix.port }}"
      - name: Container startup, health, capabilities, invocation, and knowledge
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          mkdir -p "$workdir/config" "$workdir/knowledge" "$workdir/data"
          chmod 0777 "$workdir/data"
          cat > "$workdir/config/agent.yaml" <<'YAML'
          model:
            provider: fake
            name: fake/default
          knowledge:
            path: /knowledge
            database: /data/knowledge.sqlite3
            reload:
              mode: startup
          YAML
          printf '%s\n' 'CI knowledge acceptance document.' > "$workdir/knowledge/policy.md"
          name="owa-${{ matrix.engine }}-ci"
          log_file="$RUNNER_TEMP/owa-${{ matrix.engine }}-container.log"
          docker run --detach --name "$name" --publish ${{ matrix.port }}:8080 \
            --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m --user 12345:0 \
            --volume "$workdir/config:/config:ro" \
            --volume "$workdir/knowledge:/knowledge:ro" \
            --volume "$workdir/data:/data:rw" \
            "owa-${{ matrix.engine }}:${{ github.sha }}"
          cleanup() {
            docker logs "$name" > "$log_file" 2>&1 || true
            docker rm --force "$name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:${{ matrix.port }}/health/ready" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "http://127.0.0.1:${{ matrix.port }}/health/live" >/dev/null
          curl --fail --silent "http://127.0.0.1:${{ matrix.port }}/health/ready" >/dev/null
          capabilities="$(curl --fail --silent "http://127.0.0.1:${{ matrix.port }}/v1/capabilities")"
          python -c 'import json, sys; d=json.loads(sys.argv[1]); assert d["engine"] == sys.argv[2]; assert d["workflowDsl"] == "1.0.3"; assert d["features"]["resume"] is True; assert d["features"]["cancellation"] is True; assert d["features"]["waiting"] is True; assert d["features"]["events"] == {"emit": True, "listen": True, "durable": True}; assert d["features"]["cloudEvents"] == {"lifecycle": True, "specversion": "1.0", "delivery": "bounded_snapshot", "durable": False}; assert d["features"]["scheduling"] == {"after": True, "every": True, "cron": True, "on": True, "durable": True, "owner": "fenced_workers"}; assert d["features"]["subWorkflows"] == {"run": True, "separateInvocation": True, "localCatalog": True, "externalCatalog": False}' "$capabilities" "${{ matrix.engine }}"
          event="$(curl --fail --silent --request POST --header 'content-type: application/json' --data '{"event":{"id":"ci-event-1","type":"ci.acceptance","data":{"ok":true}}}' "http://127.0.0.1:${{ matrix.port }}/v1/events")"
          python -c 'import json, sys; d=json.loads(sys.argv[1]); assert d["id"] == "ci-event-1"; assert d["type"] == "ci.acceptance"' "$event"
          invocation="$(curl --fail --silent --request POST --header 'content-type: application/json' --data '{"input":{"question":"ci"}}' "http://127.0.0.1:${{ matrix.port }}/v1/invoke")"
          python -c 'import json, sys; d=json.loads(sys.argv[1]); assert d["status"] == "completed"; assert d["output"]["response"]["question"] == "ci"' "$invocation"
          lifecycle="$(curl --fail --silent "http://127.0.0.1:${{ matrix.port }}/v1/events/lifecycle?limit=2")"
          python -c 'import json, sys; events=json.loads(sys.argv[1]); assert len(events) == 2; assert all(event["specversion"] == "1.0" for event in events); assert all(event["source"] == "urn:open-workflow-agent:lifecycle" for event in events)' "$lifecycle"
          reload="$(curl --fail --silent --request POST "http://127.0.0.1:${{ matrix.port }}/v1/admin/knowledge/reload")"
          python -c 'import json, sys; d=json.loads(sys.argv[1]); assert d["added"] == 0; assert d["unchanged"] == 1' "$reload"
      - name: Container stop, restart, and resume acceptance
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          mkdir -p "$workdir/config" "$workdir/knowledge" "$workdir/data"
          chmod 0777 "$workdir/data"
          cat > "$workdir/config/agent.yaml" <<'YAML'
          model:
            provider: fake
            name: fake/default
          workflow:
            path: /config/resume.yaml
          knowledge:
            path: /knowledge
            database: /data/knowledge.sqlite3
            reload:
              mode: startup
          YAML
          cat > "$workdir/config/resume.yaml" <<'YAML'
          document:
            dsl: '1.0.3'
            namespace: ci
            name: restart-resume
            version: '1.0.0'
          do:
            - pause:
                wait:
                  seconds: 30
            - finish:
                set:
                  done: true
          YAML
          printf '%s\n' 'CI restart-resume acceptance document.' > "$workdir/knowledge/policy.md"
          name="owa-${{ matrix.engine }}-resume"
          resumed_name="${name}-restarted"
          log_file="$RUNNER_TEMP/owa-${{ matrix.engine }}-resume.log"
          resumed_log_file="$RUNNER_TEMP/owa-${{ matrix.engine }}-resume-restarted.log"
          cleanup() {
            docker logs "$name" > "$log_file" 2>&1 || true
            docker logs "$resumed_name" > "$resumed_log_file" 2>&1 || true
            docker rm --force "$name" "$resumed_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name "$name" --publish ${{ matrix.resume_port }}:8080 \
            --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m --user 12345:0 \
            --volume "$workdir/config:/config:ro" \
            --volume "$workdir/knowledge:/knowledge:ro" \
            --volume "$workdir/data:/data:rw" \
            "owa-${{ matrix.engine }}:${{ github.sha }}"
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:${{ matrix.resume_port }}/health/ready" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "http://127.0.0.1:${{ matrix.resume_port }}/health/ready" >/dev/null
          curl --fail --silent --request POST --header 'content-type: application/json' \
            --data '{"input":{}}' "http://127.0.0.1:${{ matrix.resume_port }}/v1/invoke" > "$workdir/invoke.json" &
          invoke_pid=$!
          invocation_id=""
          for attempt in $(seq 1 30); do
            invocation_id="$(python - "$workdir/data/runtime.sqlite3" <<'PY'
          import sqlite3
          import sys
          try:
              with sqlite3.connect(sys.argv[1]) as connection:
                  row = connection.execute(
                      "SELECT invocation_id FROM invocations WHERE status = 'waiting' ORDER BY rowid DESC LIMIT 1"
                  ).fetchone()
              print(row[0] if row else "")
          except sqlite3.Error:
              print("")
          PY
            )"
            if [[ -n "$invocation_id" ]]; then
              break
            fi
            sleep 1
          done
          test -n "$invocation_id"
          docker stop --time 1 "$name" >/dev/null
          kill "$invoke_pid" >/dev/null 2>&1 || true
          wait "$invoke_pid" >/dev/null 2>&1 || true
          docker rm "$name" >/dev/null
          docker run --detach --name "$resumed_name" --publish ${{ matrix.resume_port }}:8080 \
            --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m --user 12345:0 \
            --volume "$workdir/config:/config:ro" \
            --volume "$workdir/knowledge:/knowledge:ro" \
            --volume "$workdir/data:/data:rw" \
            "owa-${{ matrix.engine }}:${{ github.sha }}"
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:${{ matrix.resume_port }}/health/ready" >/dev/null; then
              break
            fi
            sleep 1
          done
          # A forced stop retains the old owner's live lease. Wait for its
          # actual expiry; never delete or shorten the production ownership row.
          for attempt in $(seq 1 60); do
            status="$(curl --silent --show-error --max-time 45 \
              --output "$workdir/resume.json" --write-out '%{http_code}' \
              --request POST --header 'content-type: application/json' \
              --data '{"input":{}}' \
              "http://127.0.0.1:${{ matrix.resume_port }}/v1/invocations/${invocation_id}/resume")"
            if [[ "$status" == 200 ]]; then
              break
            fi
            test "$status" = 409
            python - "$workdir/resume.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1]) as source:
              error = json.load(source)["error"]
          assert error["code"] == "invalid_invocation_state", error
          assert error["message"] == "invocation execution ownership is unavailable", error
          PY
            sleep 1
          done
          test "$status" = 200
          python - "$workdir/resume.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1]) as source:
              result = json.load(source)
          assert result["status"] == "completed", result
          assert result["output"] == {"done": True}, result
          PY
      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-${{ matrix.engine }}-logs
          path: ${{ runner.temp }}/owa-${{ matrix.engine }}-*.log
          if-no-files-found: ignore
