[project]
name = "open-workflow-agent-core"
version = "0.2.0"
description = "Framework-neutral Open Workflow Agent contracts and services"
license = "MIT"
license-files = ["../../LICENSE"]
readme = "README.md"
authors = [{ name = "Bassem Zohdy" }]
requires-python = ">=3.12"
dependencies = [
  "croniter==6.2.4",
  "tzdata==2026.5",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "mcp==2.3.0",
  "a2a-sdk==1.2.2",
  "grpcio==1.84.0",
  "jsonschema==4.26.0",
  "referencing==0.37.0",
  "jq==1.12.0",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
model = ["litellm==1.98.0"]
knowledge = [
  "fastembed==0.8.0",
  "numpy==2.5.2",
  "pypdf==6.19.0",
]
postgres = ["psycopg[binary]==3.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_workflow_agent"]

[tool.hatch.build.hooks.custom]
