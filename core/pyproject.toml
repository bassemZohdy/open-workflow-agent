[project]
name = "open-workflow-agent-core"
version = "0.1.0"
description = "Framework-neutral Open Workflow Agent contracts and services"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "numpy>=2.0",
  "pypdf>=5.0",
  "pydantic>=2.7",
  "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_workflow_agent"]
