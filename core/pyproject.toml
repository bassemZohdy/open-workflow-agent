[project]
name = "open-workflow-agent-core"
version = "0.1.0"
description = "Framework-neutral Open Workflow Agent contracts and services"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "numpy==2.4.6; python_version < '3.12'",
  "numpy==2.5.2; python_version >= '3.12'",
  "pypdf==6.16.2",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
model = ["litellm==1.80.5"]
knowledge = ["fastembed==0.8.0"]
postgres = ["psycopg[binary]==3.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_workflow_agent"]
