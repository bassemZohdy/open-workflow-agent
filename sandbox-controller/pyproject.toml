[project]
name = "open-workflow-agent-sandbox-controller"
version = "0.1.0"
description = "Restricted Docker execution controller for Open Workflow Agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "uvicorn==0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_workflow_agent_sandbox_controller"]
