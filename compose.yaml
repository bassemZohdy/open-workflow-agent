name: open-workflow-agent

services:
  adk:
    profiles: ["adk"]
    build:
      context: .
      dockerfile: docker/Dockerfile.adk
      args:
        OWA_VERSION: ${OWA_VERSION:-0.2.0}
        VCS_REF: ${VCS_REF:-local}
    image: ${ADK_IMAGE:-owa-adk:local}
    env_file:
      - path: .env
        required: false
    environment:
      OWA__MODEL__PROVIDER: ${MODEL_PROVIDER:-fake}
      OWA__MODEL__NAME: ${MODEL_NAME:-fake/default}
      OWA__PERSISTENCE__DATASOURCE: ${OWA__PERSISTENCE__DATASOURCE:-}
      OWA__KNOWLEDGE__PATH: /knowledge
      OWA__SERVER__HOST: 0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${ADK_PORT:-8080}:8080"
    volumes:
      - adk_data:/data
      - ./knowledge:/knowledge:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    user: "10001:0"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,sys,urllib.request; port=os.environ.get('OWA__SERVER__PORT','8080'); sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{port}/health/ready',timeout=4).status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    restart: unless-stopped

  langgraph:
    profiles: ["langgraph"]
    build:
      context: .
      dockerfile: docker/Dockerfile.langgraph
      args:
        OWA_VERSION: ${OWA_VERSION:-0.2.0}
        VCS_REF: ${VCS_REF:-local}
    image: ${LANGGRAPH_IMAGE:-owa-langgraph:local}
    env_file:
      - path: .env
        required: false
    environment:
      OWA__MODEL__PROVIDER: ${MODEL_PROVIDER:-fake}
      OWA__MODEL__NAME: ${MODEL_NAME:-fake/default}
      OWA__PERSISTENCE__DATASOURCE: ${OWA__PERSISTENCE__DATASOURCE:-}
      OWA__KNOWLEDGE__PATH: /knowledge
      OWA__SERVER__HOST: 0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LANGGRAPH_PORT:-8081}:8080"
    volumes:
      - langgraph_data:/data
      - ./knowledge:/knowledge:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    user: "10001:0"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,sys,urllib.request; port=os.environ.get('OWA__SERVER__PORT','8080'); sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{port}/health/ready',timeout=4).status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    restart: unless-stopped

volumes:
  adk_data:
  langgraph_data:
