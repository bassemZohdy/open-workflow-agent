engine: adk

image:
  repository: ghcr.io/bassemzohdy/open-workflow-agent-adk
  tag: latest
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 0
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

env:
  - name: OWA__MODEL__PROVIDER
    value: fake
  - name: OWA__MODEL__NAME
    value: fake/default
  - name: OWA__SERVER__HOST
    value: 0.0.0.0

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

persistence:
  enabled: true
  size: 5Gi
  storageClassName: ""
  accessModes:
    - ReadWriteOnce

config:
  existingConfigMap: ""
  mountPath: /config

knowledge:
  existingConfigMap: ""
  mountPath: /knowledge

tmp:
  sizeLimit: 256Mi

networkPolicy:
  enabled: true

ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  host: owa.example.com
  tls:
    enabled: true
    secretName: owa-tls

httpRoute:
  enabled: false
  parentRefs:
    - name: owa-gateway
      sectionName: http
  hostnames:
    - owa.example.com

monitoring:
  serviceMonitor:
    enabled: false
    labels:
      prometheus: kube-prometheus
    interval: 30s
    scrapeTimeout: 10s
  prometheusRule:
    enabled: false
    labels:
      prometheus: kube-prometheus

